[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traza"
version = "0.0.1"
description = "Local live panel for Claude Code agents, tokens and estimated cost"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["traza"]

[tool.setuptools.package-data]
traza = ["prices.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
