[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traza"
version = "0.0.1"
description = "Local live panel for Claude Code: agent tree, live state, tokens and value at API prices"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Lander Iglesias"}]
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.urls]
Repository = "https://github.com/LanderIglesias/traza"

[project.scripts]
traza = "traza.__main__:main"

[tool.setuptools]
packages = ["traza"]

[tool.setuptools.package-data]
traza = ["prices.toml", "static/*.html", "static/*.css", "static/*.js", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
